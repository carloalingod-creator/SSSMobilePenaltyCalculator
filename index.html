<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SSS Mobile Penalty Calculator</title>
<style>
  :root {
    --blue: #4560ad;
    --blue-dark: #2f4a9e;
    --bg: #e8eaf2;
    --soft: #f0f6fb;
    --pink: #f7dcdc;
    --red: #a31d1d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 16px;
    background: var(--bg);
    font-family: "Segoe UI", system-ui, sans-serif;
    color: #222;
  }
  .wrap { max-width: 560px; margin: 0 auto; }

  header { margin-bottom: 14px; }
  /* To add your own logo: put logo.png in the repo and add an <img src="logo.png"> inside the header */
  header h1 { margin: 0; font-size: 1.25rem; color: var(--blue-dark); line-height: 1.2; }
  header p { margin: 2px 0 0; font-size: .85rem; color: #333; }

  .section-title {
    background: var(--blue);
    color: #fff;
    padding: 9px 14px;
    border-radius: 6px 6px 0 0;
    font-size: 1rem;
    margin-top: 14px;
  }
  .panel {
    background: #fff;
    padding: 14px;
    border-radius: 0 0 6px 6px;
    box-shadow: 0 1px 4px rgba(0,0,0,.1);
  }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 12px; }
  label { display: block; color: var(--blue-dark); font-size: .9rem; margin-bottom: 4px; }
  select, input {
    width: 100%;
    padding: 10px;
    font-size: 1rem;
    border: 1.5px solid #1e2a78;
    border-radius: 0;
    background: #fff;
    color: #222;
  }

  /* Make every field the same height and keep iPhone date fields inside their boxes */
  select, input[type="number"], input[type="date"] {
    height: 48px;
    min-width: 0;
    max-width: 100%;
  }
  input[type="date"] {
    -webkit-appearance: none;
    appearance: none;
    display: block;
    text-align: left;
    line-height: normal;
  }
  input[type="date"]::-webkit-date-and-time-value { text-align: left; }
  input[type="date"]::-webkit-datetime-edit { padding: 0; }

  /* One card per delinquent month */
  .period {
    border: 1.5px solid #c9d1ea;
    border-radius: 8px;
    padding: 12px;
    margin-bottom: 14px;
    background: #fafbfe;
  }
  .period-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }
  .period-head strong { color: var(--blue-dark); }
  .remove-btn {
    background: #fff;
    color: var(--red);
    border: 1px solid var(--red);
    padding: 4px 10px;
    font-size: .8rem;
    border-radius: 6px;
  }
  .warn { color: var(--red); font-size: .85rem; margin-top: 8px; min-height: 0; }
  .stats {
    margin-top: 12px;
    background: var(--soft);
    padding: 8px 10px;
    font-size: .9rem;
    color: var(--blue-dark);
  }
  .stats div { display: flex; justify-content: space-between; padding: 2px 0; }
  .stats .days { font-weight: 700; }

  .add-wrap { text-align: center; }
  .add-btn { background: #fff; color: var(--blue-dark); border: 2px dashed var(--blue); width: 100%; }

  .pen-row {
    background: var(--pink);
    color: var(--red);
    padding: 9px 10px;
    margin-bottom: 8px;
    display: flex;
  }
  .pen-row:last-child { margin-bottom: 0; }
  .pen-row span:first-child { width: 170px; font-weight: 600; }

  .total-box {
    background: var(--soft);
    margin-top: 14px;
    padding: 12px 14px 8px;
    text-align: center;
    box-shadow: 0 1px 4px rgba(0,0,0,.1);
  }
  .total-box .cap { font-weight: 700; color: var(--blue-dark); padding-bottom: 6px; border-bottom: 1px solid var(--blue); }
  .total-box .big { font-size: 3rem; font-weight: 700; color: var(--blue-dark); }

  .reset-wrap { text-align: center; margin: 18px 0 8px; }
  button {
    background: var(--blue);
    color: #fff;
    border: none;
    padding: 12px 36px;
    font-size: 1rem;
    border-radius: 8px;
    cursor: pointer;
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>SSS Mobile Penalty Calculator</h1>
    <p>Compute penalties for late contribution payments</p>
  </header>

  <div class="section-title">Payment Details</div>
  <div class="panel">
    <label for="payDate">Date of Payment</label>
    <input id="payDate" type="date">
  </div>

  <div class="section-title">Contribution Details</div>
  <div class="panel">
    <p style="margin:0 0 12px;font-size:.85rem;color:#555;">Applicable months: January 2018 to present.</p>
    <div id="periods"></div>
    <div class="add-wrap">
      <button id="addBtn" class="add-btn">+ Add Another Month</button>
    </div>
  </div>

  <div class="section-title">Penalty Computation</div>
  <div class="panel">
    <div class="pen-row"><span>Months Included:</span><span id="count">0</span></div>
    <div class="pen-row"><span>Total SS Penalty:</span><span id="ssPen">0.00</span></div>
    <div class="pen-row"><span>Total EC Penalty:</span><span id="ecPen">0.00</span></div>
    <div class="pen-row"><span>Total Penalty:</span><span id="totPen">0.00</span></div>
  </div>

  <div class="total-box">
    <div class="cap">Total Amount Due</div>
    <div class="big" id="totalDue">0.00</div>
  </div>

  <div class="reset-wrap"><button id="resetBtn">Reset</button></div>
</div>

<script>
  // =====================================================
  // SETTINGS - replace these with YOUR rules / formulas
  // =====================================================

  // Penalty rate per day of delay (from your Power Apps SS Penalty formula)
  const PENALTY_RATE_PER_DAY = 0.000667;

  // Due date from the applicable month and year (from your Power Apps formula)
  // month = 1..12, year = full year. Returns "YYYY-MM-DD".
  function getDueDate(month, year) {
    const key = year * 100 + month; // e.g. March 2020 -> 202003

    // Special extended deadlines
    if (key >= 202002 && key <= 202010) return "2020-11-30"; // Feb-Oct 2020
    if (key === 202107) return "2021-09-30";                 // Jul 2021
    if (key === 202207) return "2022-09-30";                 // Jul 2022
    if (key === 202306) return "2023-09-30";                 // Jun 2023
    if (key === 202309 || key === 202310) return "2023-12-29"; // Sep & Oct 2023

    // Standard rule: last day of the month after the applicable month
    const d = new Date(Date.UTC(year, month + 1, 0));
    return d.toISOString().slice(0, 10);
  }

  // ---- DAYS DELAYED START (from your Power Apps formula) ----
  // Pandemic exemption period (days inside it are not counted)
  const EXEMPT_START = "2020-03-15";
  const EXEMPT_END = "2022-03-01";

  function parts(s) {
    const [y, m, d] = s.split("-").map(Number);
    return { y, m, d };
  }

  // 360-day value used for the due date (and exemption dates)
  function val360Start(s) {
    const p = parts(s);
    return p.y * 360 + (p.m - 1) * 30 + ((p.m === 2 && p.d >= 28) ? 30 : Math.min(30, p.d));
  }

  // 360-day value used for the payment date
  function val360End(s) {
    const p = parts(s);
    return p.y * 360 + (p.m - 1) * 30 + ((p.m === 2 && p.d >= 29) ? 29 : Math.min(30, p.d));
  }

  // Due date used for counting delay: special deadlines, otherwise the due date field
  function effectiveDue(month, year, dueStr) {
    const key = Number(year) * 100 + Number(month);
    if (key === 202207) return "2022-09-30";
    if (key === 202306) return "2023-09-30";
    if (key === 202309 || key === 202310) return "2023-12-29";
    return dueStr;
  }

  function computeDaysDelayed(month, year, dueStr, payStr) {
    if (!month || !year || !dueStr || !payStr) return 0;
    const due = effectiveDue(month, year, dueStr);
    const startVal = val360Start(due);
    const endVal = val360End(payStr);

    // Overlap with the exemption period
    const oStart = due > EXEMPT_START ? due : EXEMPT_START;
    const oEnd = payStr < EXEMPT_END ? payStr : EXEMPT_END;
    let exempt = 0;
    if (oStart <= oEnd) {
      exempt = Math.max(0, val360Start(oEnd) - val360Start(oStart));
    }
    return Math.max(0, (endVal - startVal) - exempt);
  }
  // ---- DAYS DELAYED END ----

  // ---- PENALTY START (from your Power Apps SS Penalty formula) ----
  // The penalty formula uses its own exemption end date (Feb 28, 2022),
  // which differs from the one in the Days Delayed formula (Mar 1, 2022).
  const PEN_EXEMPT_END = "2022-02-28";

  // Days used for the penalty computation
  function computePenaltyDays(month, year, dueStr, payStr) {
    if (!month || !year || !dueStr || !payStr) return 0;
    const key = Number(year) * 100 + Number(month);

    // No penalty if the applicable month is within Mar 2020 - Feb 2022
    if (key >= 202003 && key <= 202202) return 0;

    let due = effectiveDue(month, year, dueStr);
    if (key === 202002) due = "2022-02-28"; // Feb 2020 special deadline

    const startVal = val360Start(due);
    const endVal = val360End(payStr);

    const oStart = due > EXEMPT_START ? due : EXEMPT_START;
    const oEnd = payStr < PEN_EXEMPT_END ? payStr : PEN_EXEMPT_END;
    let exempt = 0;
    if (oStart <= oEnd) {
      exempt = Math.max(0, val360Start(oEnd) - val360Start(oStart));
    }
    return Math.max(0, (endVal - startVal) - exempt);
  }

  // Penalty = amount x days x daily rate, rounded to 2 decimals
  function computePenalty(amount, penaltyDays) {
    const raw = amount * penaltyDays * PENALTY_RATE_PER_DAY;
    return Math.round((raw + Number.EPSILON) * 100) / 100;
  }
  // Days used for the EC penalty (from your Power Apps EC Penalty formula).
  // Different from SS: no pandemic exemption and no zero-penalty window,
  // and Feb-Oct 2020 and Jul 2021 have their own deadlines.
  function computeECPenaltyDays(month, year, dueStr, payStr) {
    if (!month || !year || !dueStr || !payStr) return 0;
    const key = Number(year) * 100 + Number(month);

    let due = dueStr;
    if (key >= 202002 && key <= 202010) due = "2020-11-30";
    else if (key === 202107) due = "2021-09-30";
    else if (key === 202207) due = "2022-09-30";
    else if (key === 202306) due = "2023-09-30";
    else if (key === 202309 || key === 202310) due = "2023-12-29";

    return Math.max(0, val360End(payStr) - val360Start(due));
  }
  // ---- PENALTY END ----

  // =====================================================
  // APP CODE
  // =====================================================
  const $ = id => document.getElementById(id);
  const MONTHS = ["January","February","March","April","May","June",
                  "July","August","September","October","November","December"];

  function monthOptions() {
    return '<option value="">Select Month</option>' +
      MONTHS.map((m, i) => `<option value="${i + 1}">${m}</option>`).join("");
  }

  function yearOptions() {
    const thisYear = new Date().getFullYear();
    let html = ''; // current year is the top option; the list ends at 2018
    for (let y = thisYear; y >= 2018; y--) html += `<option value="${y}">${y}</option>`;
    return html;
  }

  function todayString() {
    const t = new Date();
    const p = n => String(n).padStart(2, "0");
    return `${t.getFullYear()}-${p(t.getMonth() + 1)}-${p(t.getDate())}`;
  }

  function money(n) {
    return n.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function dayDiff(fromStr, toStr) {
    const a = Date.parse(fromStr + "T00:00:00Z");
    const b = Date.parse(toStr + "T00:00:00Z");
    return Math.round((b - a) / 86400000);
  }

  // Calculator covers January 2018 up to the present month.
  // Months later than this month are disabled when the current year is selected.
  function limitMonths(card) {
    const now = new Date();
    const y = parseInt(card.querySelector(".p-year").value, 10);
    const sel = card.querySelector(".p-month");
    Array.from(sel.options).forEach(o => {
      const m = parseInt(o.value, 10);
      o.disabled = !!(m && y === now.getFullYear() && m > now.getMonth() + 1);
    });
    if (sel.selectedOptions[0] && sel.selectedOptions[0].disabled) sel.value = "";
  }

  // ---------- Month cards ----------
  function addPeriod(prefMonth, prefYear) {
    const card = document.createElement("div");
    card.className = "period";
    card.innerHTML = `
      <div class="period-head">
        <strong class="p-title">Month 1</strong>
        <button class="remove-btn">Remove</button>
      </div>
      <div class="grid">
        <div><label>Applicable Month</label><select class="p-month">${monthOptions()}</select></div>
        <div><label>Applicable Year</label><select class="p-year">${yearOptions()}</select></div>
        <div><label>SS Amount (₱)</label><input class="p-ss" type="number" inputmode="decimal" min="0" placeholder="Enter amount"></div>
        <div><label>EC Amount (₱)</label><input class="p-ec" type="number" inputmode="decimal" min="0" placeholder="Enter amount"></div>
        <div style="grid-column: 1 / -1"><label>Due Date / Deadline</label><input class="p-due" type="date"></div>
      </div>
      <div class="warn p-warn"></div>
      <div class="stats">
        <div><span>No. of Days Delayed</span><span class="days p-days">0</span></div>
        <div><span>SS Penalty</span><span class="p-sspen">0.00</span></div>
        <div><span>EC Penalty</span><span class="p-ecpen">0.00</span></div>
        <div><span>Total Penalty</span><span class="p-totpen">0.00</span></div>
        <div><span>Month Total (with penalty)</span><span class="p-sub">0.00</span></div>
      </div>`;

    if (prefMonth) card.querySelector(".p-month").value = prefMonth;
    card.querySelector(".p-year").value = prefYear || new Date().getFullYear();

    const refreshDue = () => {
      limitMonths(card);
      const m = parseInt(card.querySelector(".p-month").value, 10);
      const y = parseInt(card.querySelector(".p-year").value, 10);
      card.querySelector(".p-due").value = (m && y) ? getDueDate(m, y) : "";
      recalc();
    };
    card.querySelector(".p-month").addEventListener("change", refreshDue);
    card.querySelector(".p-year").addEventListener("change", refreshDue);
    ["p-ss", "p-ec", "p-due"].forEach(c => card.querySelector("." + c).addEventListener("input", recalc));
    card.querySelector(".remove-btn").addEventListener("click", () => {
      card.remove();
      recalc();
    });

    $("periods").appendChild(card);
    refreshDue();
  }

  // Suggest the month after the last one entered (Jan -> Feb, Dec -> Jan next year)
  function addNextPeriod() {
    const cards = document.querySelectorAll(".period");
    let m = "", y = "";
    if (cards.length) {
      const last = cards[cards.length - 1];
      const lm = parseInt(last.querySelector(".p-month").value, 10);
      const ly = parseInt(last.querySelector(".p-year").value, 10);
      if (lm && ly) {
        m = lm === 12 ? 1 : lm + 1;
        y = lm === 12 ? ly + 1 : ly;
        // Don't suggest a month later than the present month
        const now = new Date();
        if (y * 100 + m > now.getFullYear() * 100 + (now.getMonth() + 1)) { m = ""; y = ""; }
      }
    }
    addPeriod(m, y);
  }

  // ---------- Calculation ----------
  function recalc() {
    const paid = $("payDate").value;
    const cards = document.querySelectorAll(".period");
    let totSS = 0, totEC = 0, totSSPen = 0, totECPen = 0;
    const seen = {};

    cards.forEach((card, i) => {
      card.querySelector(".p-title").textContent = "Month " + (i + 1);
      card.querySelector(".remove-btn").style.display = cards.length > 1 ? "" : "none";

      const ss = parseFloat(card.querySelector(".p-ss").value) || 0;
      const ec = parseFloat(card.querySelector(".p-ec").value) || 0;
      const due = card.querySelector(".p-due").value;
      const m = card.querySelector(".p-month").value;
      const y = card.querySelector(".p-year").value;

      const days = computeDaysDelayed(m, y, due, paid);

      const penDays = computePenaltyDays(m, y, due, paid);
      const ssPen = computePenalty(ss, penDays);
      const ecDays = computeECPenaltyDays(m, y, due, paid);
      const ecPen = computePenalty(ec, ecDays);

      card.querySelector(".p-days").textContent = days;
      card.querySelector(".p-sspen").textContent = money(ssPen);
      card.querySelector(".p-ecpen").textContent = money(ecPen);
      card.querySelector(".p-totpen").textContent = money(ssPen + ecPen);
      card.querySelector(".p-sub").textContent = money(ss + ec + ssPen + ecPen);

      // Warn if the same month and year are entered twice
      const warn = card.querySelector(".p-warn");
      const key = m && y ? m + "-" + y : "";
      if (key && seen[key]) {
        warn.textContent = "This month and year is already entered above.";
      } else {
        warn.textContent = "";
      }
      if (key) seen[key] = true;

      totSS += ss; totEC += ec; totSSPen += ssPen; totECPen += ecPen;
    });

    const totPen = totSSPen + totECPen;
    $("count").textContent = cards.length;
    $("ssPen").textContent = money(totSSPen);
    $("ecPen").textContent = money(totECPen);
    $("totPen").textContent = money(totPen);
    $("totalDue").textContent = money(totSS + totEC + totPen);
  }

  function resetAll() {
    $("periods").innerHTML = "";
    $("payDate").value = todayString();
    addPeriod();
  }

  $("payDate").value = todayString();
  $("payDate").addEventListener("input", recalc);
  $("addBtn").addEventListener("click", addNextPeriod);
  $("resetBtn").addEventListener("click", resetAll);
  addPeriod();
</script>

<script data-goatcounter="https://rafaelcarlo.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
